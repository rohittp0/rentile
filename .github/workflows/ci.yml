name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  coverage-manifest:
    name: Coverage manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate credential-free coverage
        run: python3 tools/check_coverage_manifest.py compatibility/rentile-v1-coverage.json

  android-jvm-linux:
    name: Android, JVM and Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and compile
        run: >-
          ./gradlew --no-configuration-cache
          :kmp:checkKotlinAbi
          :kmp:testAndroidHostTest
          :kmp:jvmTest
          :kmp:linuxX64Test
          :kmp:compileKotlinLinuxArm64
          :kmp:bundleAndroidMainAar

  apple-publication:
    name: Apple and publication metadata
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile and test Apple targets and publish locally
        run: >-
          ./gradlew --no-configuration-cache
          :kmp:compileKotlinIosArm64
          :kmp:compileKotlinIosSimulatorArm64
          :kmp:macosArm64Test
          :kmp:publishAllPublicationsToLocalTestRepository
      - name: Resolve aggregate coordinate from clean consumer
        run: >-
          ./gradlew --no-configuration-cache -p consumer-smoke
          compileAndroidMain
          compileKotlinJvm
          compileKotlinIosArm64
          compileKotlinIosSimulatorArm64
          compileKotlinMacosArm64
          compileKotlinLinuxX64
          compileKotlinLinuxArm64
