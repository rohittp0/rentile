name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compatibility-manifest:
    name: Compatibility manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate pinned credential-free manifest
        run: python3 tools/check_compatibility_manifest.py compatibility/rentile-v1.json

  android-linux:
    name: Android and Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and compile
        run: >-
          ./gradlew --no-configuration-cache
          :kmp:checkKotlinAbi
          :kmp:testAndroidHostTest
          :kmp:linuxX64Test
          :kmp:compileKotlinLinuxArm64
          :kmp:bundleAndroidMainAar

  apple-publication:
    name: Apple and publication metadata
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile Apple targets and publish locally
        run: >-
          ./gradlew --no-configuration-cache
          :kmp:compileKotlinIosArm64
          :kmp:compileKotlinIosSimulatorArm64
          :kmp:publishAllPublicationsToLocalTestRepository
      - name: Resolve aggregate coordinate from clean consumer
        run: >-
          ./gradlew --no-configuration-cache -p consumer-smoke
          compileAndroidMain
          compileKotlinIosArm64
          compileKotlinIosSimulatorArm64
          compileKotlinLinuxX64
          compileKotlinLinuxArm64
