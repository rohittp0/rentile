name: Build and Publish

on:
  push:
    branches: [main]
    # Documentation-only commits must not consume a public version. Every other
    # push to main cuts a release.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

# Releases are serialised. Two concurrent runs would resolve the same next
# version and race for one immutable coordinate, and cancelling a run mid-upload
# would leave a partially published version behind.
concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  resolve-version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - id: release
        name: Resolve the next public version
        shell: bash
        env:
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${R2_PUBLIC_URL:-}" ]]; then
            echo "::error::Missing publishing value: R2_PUBLIC_URL"
            exit 1
          fi

          base="${R2_PUBLIC_URL%/}/com/rohittp/rentile/kmp"

          pom_status() {
            curl --silent --output /dev/null --write-out '%{http_code}' \
              --retry 5 --retry-delay 3 --retry-all-errors \
              --head "${base}/$1/kmp-$1.pom" || echo 000
          }

          # Strictly greater, semver-ordered.
          is_greater() {
            [[ "$1" != "$2" && "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" == "$1" ]]
          }

          declared=$(sed -n 's/^VERSION_NAME=//p' gradle.properties | tr -d '[:space:]')
          if [[ -z "$declared" ]]; then
            echo "::error::VERSION_NAME is missing"
            exit 1
          fi
          if [[ ! "$declared" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT)?$ ]]; then
            echo "::error::VERSION_NAME must be MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-SNAPSHOT: $declared"
            exit 1
          fi

          # An absent metadata document means nothing has been published yet,
          # which is not an error. `latest` is not trusted; the versions list is
          # ordered explicitly.
          metadata=$(curl --fail --silent --retry 3 --retry-delay 2 \
            "${base}/maven-metadata.xml" || true)

          published_latest=""
          if [[ -n "$metadata" ]]; then
            published_latest=$(printf '%s' "$metadata" \
              | grep -o '<version>[^<]*</version>' \
              | sed -e 's|<version>||g' -e 's|</version>||g' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -1 || true)
          fi

          if [[ -z "$published_latest" ]] \
            || { [[ "$declared" != *-SNAPSHOT ]] && is_greater "$declared" "$published_latest"; }; then
            # A declared version above everything public is a deliberate minor or
            # major bump and governs the release outright.
            if [[ "$declared" == *-SNAPSHOT ]]; then
              echo "::error::Snapshot versions cannot be published to the public repository: $declared"
              exit 1
            fi
            status=$(pom_status "$declared")
            if [[ "$status" == "200" ]]; then
              echo "::error::Declared VERSION_NAME already exists in the public repository: $declared"
              exit 1
            fi
            if [[ "$status" != "404" ]]; then
              echo "::error::Unexpected status $status probing version $declared"
              exit 1
            fi
            version="$declared"
            source="declared VERSION_NAME"
          else
            # Routine push: take the newest public version and advance the patch
            # past anything already present, so stale metadata cannot collide.
            IFS='.' read -r major minor patch <<<"$published_latest"
            attempts=0
            while :; do
              patch=$((patch + 1))
              version="${major}.${minor}.${patch}"
              status=$(pom_status "$version")
              [[ "$status" == "404" ]] && break
              if [[ "$status" != "200" ]]; then
                echo "::error::Unexpected status $status probing version $version"
                exit 1
              fi
              attempts=$((attempts + 1))
              if ((attempts >= 20)); then
                echo "::error::No unused patch version found after 20 attempts from $published_latest"
                exit 1
              fi
            done
            source="patch increment from published $published_latest"
          fi

          echo "Resolved version $version ($source)" >> "$GITHUB_STEP_SUMMARY"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve-version
    name: Publish kmp ${{ needs.resolve-version.outputs.version }}
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify publishing configuration
        shell: bash
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          required=(
            R2_ENDPOINT
            R2_BUCKET
            R2_PUBLIC_URL
            R2_ACCESS_KEY_ID
            R2_SECRET_ACCESS_KEY
            SIGNING_KEY
            SIGNING_KEY_ID
            SIGNING_KEY_PASSWORD
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing publishing value: $name"
              exit 1
            fi
          done

      - name: Reject an existing release
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail
          key="com/rohittp/rentile/kmp/${VERSION}/kmp-${VERSION}.pom"

          count=$(aws \
            --endpoint-url "$R2_ENDPOINT" \
            s3api list-objects-v2 \
            --bucket "$R2_BUCKET" \
            --prefix "$key" \
            --max-keys 1 \
            --query KeyCount \
            --output text)

          if [[ "$count" != "0" ]]; then
            echo "::error::Release already exists: $key"
            exit 1
          fi

      - name: Validate credential-free coverage
        run: python3 tools/check_coverage_manifest.py compatibility/rentile-v1-coverage.json

      - name: Test and publish to isolated local repository
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-configuration-cache clean
          -PVERSION_NAME="$VERSION"
          :kmp:checkKotlinAbi
          :kmp:testAndroidHostTest
          :kmp:jvmTest
          :kmp:macosArm64Test
          :kmp:compileKotlinIosArm64
          :kmp:compileKotlinIosSimulatorArm64
          :kmp:compileKotlinLinuxX64
          :kmp:compileKotlinLinuxArm64
          :kmp:bundleAndroidMainAar
          :kmp:publishAllPublicationsToLocalTestRepository
          :kmp:checkPomFileForAndroidPublication
          :kmp:checkPomFileForJvmPublication
          :kmp:checkPomFileForIosArm64Publication
          :kmp:checkPomFileForIosSimulatorArm64Publication
          :kmp:checkPomFileForKotlinMultiplatformPublication
          :kmp:checkPomFileForLinuxArm64Publication
          :kmp:checkPomFileForLinuxX64Publication
          :kmp:checkPomFileForMacosArm64Publication

      - name: Verify signed local publication
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          artifact_root="build/local-maven/com/rohittp/rentile"
          publication_count=0

          while IFS= read -r pom; do
            publication_count=$((publication_count + 1))
            if [[ ! -f "$pom.asc" ]]; then
              echo "::error::Unsigned publication POM: $pom"
              exit 1
            fi
          done < <(find "$artifact_root" -type f -path "*/$VERSION/*" -name '*.pom' | sort)

          if (( publication_count == 0 )); then
            echo "::error::The local repository contains no publication POMs"
            exit 1
          fi

      - name: Resolve aggregate coordinate from isolated local repository
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: >-
          ./gradlew --no-configuration-cache -p consumer-smoke
          -PrentileVersion="$VERSION"
          compileAndroidMain
          compileKotlinJvm
          compileKotlinIosArm64
          compileKotlinIosSimulatorArm64
          compileKotlinMacosArm64
          compileKotlinLinuxX64
          compileKotlinLinuxArm64

      - name: Run complete map catalog corpus gate
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          RENTILE_COVERAGE_MANIFEST: ${{ github.workspace }}/compatibility/rentile-v1-coverage.json
          RENTILE_CORPUS_REPORT_DIR: ${{ github.workspace }}/build/reports/rentile-corpus
        run: >-
          ./gradlew --no-configuration-cache
          -PVERSION_NAME="$VERSION"
          :kmp:testAndroidHostTest
          --tests com.rohittp.rentile.MapCatalogCorpusSmokeTest

      - name: Upload Corpus Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rentile-corpus-${{ needs.resolve-version.outputs.version }}
          path: build/reports/rentile-corpus
          if-no-files-found: warn
          retention-days: 14

      - name: Publish coordinated KMP artifacts to R2
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-configuration-cache
          -PVERSION_NAME="$VERSION"
          :kmp:publishAllPublicationsToR2Repository

      - name: Verify public artifacts
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: |
          set -euo pipefail
          repository_root="build/local-maven"
          artifact_root="$repository_root/com/rohittp/rentile"
          artifact_count=0

          while IFS= read -r artifact; do
            relative_path="${artifact#"$repository_root/"}"
            url="${R2_PUBLIC_URL%/}/$relative_path"
            curl --fail --silent --show-error \
              --retry 12 --retry-delay 5 --retry-all-errors \
              --output /dev/null "$url"
            artifact_count=$((artifact_count + 1))
          done < <(find "$artifact_root" -type f -path "*/$VERSION/*" \
            ! -name 'maven-metadata.xml*' | sort)

          if (( artifact_count == 0 )); then
            echo "::error::No local publication artifacts were available to verify"
            exit 1
          fi

      - name: Resolve from the public repository without credentials
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          smoke_project="$RUNNER_TEMP/rentile-r2-consumer"
          gradle_home="$RUNNER_TEMP/rentile-r2-gradle-home"
          cp -R consumer-smoke "$smoke_project"
          cp gradlew "$smoke_project/gradlew"
          cp -R gradle "$smoke_project/gradle"

          "$smoke_project/gradlew" --no-configuration-cache \
            --gradle-user-home "$gradle_home" \
            --refresh-dependencies \
            -p "$smoke_project" \
            -PrentileRepositoryUrl="$R2_PUBLIC_URL" \
            -PrentileVersion="$VERSION" \
            compileAndroidMain \
            compileKotlinJvm \
            compileKotlinIosArm64 \
            compileKotlinIosSimulatorArm64 \
            compileKotlinMacosArm64 \
            compileKotlinLinuxX64 \
            compileKotlinLinuxArm64
